name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1" # Weekly on Mondays

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - uses: ./.forgejo/actions/setup
      - name: Cargo audit
        run: mise run audit
